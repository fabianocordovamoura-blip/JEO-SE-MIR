$('kl').innerHTML=K('bl',R(L.limite),'Limite (até nov/2026)')+K('yl',R(L.aguard),'Aguardando empenho')+K('gn',R(L.saldo),'Saldo disponível')}
let U,cu,sel=null;function init(){U=Object.keys(D.units).sort((a,b)=>b.localeCompare(a,'pt-BR'));cu=U.includes('SENAPIR')?'SENAPIR':U[0];sel=null;renderSummary();draw()}
function tabs(){$('tabs').innerHTML=U.map(u=>`<button class="${u==cu?'on':''}" data-u="${u}">${u}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cu=b.dataset.u;$('fpo').value='';$('fst').value='';$('finiciativa').value='';$('fq').value='';sel=null;draw()})}
function opts(el,arr,all){const v=el.value;el.innerHTML=`<option value="">${all}</option>`+arr.map(a=>`<option>${esc(a)}</option>`).join('');el.value=arr.includes(v)?v:''}
function draw(){tabs();const u=D.units[cu],base=D.ini.filter(i=>i.u==cu);
opts($('fpo'),[...new Set(base.map(i=>String(i.po||'').trim()).filter(Boolean).map(p=>p.slice(-2)))].sort(),'Todos');opts($('fst'),[...new Set(base.map(i=>i.st))].sort(),'Todos');opts($('finiciativa'),[...new Set(base.map(i=>i.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR')),'Todas as iniciativas');
$('ut').textContent=cu+' - EXECUÇÃO ORÇAMENTÁRIA';
$('gu').innerHTML=u.livre?gauge(u.emp,u.livre,u.aguard):'<p>Sem dotação livre.</p>';
$('ku').innerHTML=K('bl',M(u.livre),'Empenho do Setor',P(u.livre,u.livre)+' da dotação')+K('yl',M(u.aguard),'Aguardando empenho',P(u.aguard,u.livre)+' da dotação')+K('gn',M(u.saldo),'Saldo disponível',P(u.saldo,u.livre)+' da dotação');
const q=$('fq').value.toLowerCase(),po=$('fpo').value,st=$('fst').value,ini=$('finiciativa').value;
const l=base.filter(i=>(!po||String(i.po||'').trim().slice(-2)==po)&&(!st||i.st==st)&&(!ini||i.name==ini)&&(!q||(i.name+i.sei).toLowerCase().includes(q))); 
$('cnt').textContent='('+l.length+')';if(!l.includes(sel))sel=l.find(i=>i.obs)||l[0]||null;
$('tb').innerHTML=l.map((i,k)=>`<tr class="r ${i==sel?'on':''}" data-k="${k}"><td>${esc(String(i.po||'').trim().slice(-2))}</td><td>${esc(i.name)}</td><td>${esc(i.sei||'—')}</td><td><span class="st s-${i.st.split(' ')[0]}">${esc(i.st)}</span></td><td class="num">${i.prog?R(i.prog):'—'}</td></tr>`).join('');
document.querySelectorAll('#tb tr').forEach(r=>r.onclick=()=>{sel=l[+r.dataset.k];draw();$('dt').scrollIntoView({behavior:'smooth',block:'nearest'})});detail()}
function detail(){const i=sel;if(!i){$('dt').innerHTML='<p>Selecione uma iniciativa.</p>';return}
const f=(a,b)=>`<div><span>${a}</span><b>${esc(b||'—')}</b></div>`,bar=(a,b)=>{const pct=b?Math.max(0,a/b*100):0,cls=pct>80?'pct-red':pct>50?'pct-yellow':'';return`<div class="bar"><u class="${cls}" style="width:${Math.min(100,pct)}%"></u></div>`};pctText=(a,b)=>`${(b?Math.max(0,a/b*100):0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}%`;
const obs=i.obs?i.obs.split(/;\s*(?=\d{2}\/\d{2}\/\d{2,4}:)/).map(x=>`<li>${esc(x)}</li>`).join(''):'<li>Sem pendências registradas.</li>';
$('dt').innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:8px">${esc(i.name)}</div><div class="dg info-row-1">${f('SEI',i.sei)}${f('Diretoria',i.dir)}${f('Status',i.st)}${f('Instrumento',i.inst)}${f('Parceiro',i.parc)}${f('SIAFI',i.siafi)}${f('Ano de formalização',i.ano)}${f('Previsão de descentralização',i.prev)}</div>
<div class="detail-layout"><div class="dg info-row-2">${f('Responsável',i.resp)}${f('Ação / PO',i.acao+' / '+i.po)}</div><div class="finance-card finance-program"><div class="finance-label"><span>Programado 2026</span></div><b>${R(i.prog)}</b></div><div class="finance-card finance-liquidado"><div class="finance-label"><span>Liquidado 2026</span><strong class="finance-pct">${pctText(i.liq,i.prog)}</strong></div><b>${R(i.liq)}</b>${bar(i.liq,i.prog)}</div><div class="detail-ppa"><div class="box"><h3>Entrega PPA</h3><div class="ppa-value">${esc(i.ppa||'—')}</div></div></div><div class="finance-card finance-empenhado"><div class="finance-label"><span>Empenhado 2026</span><strong class="finance-pct">${pctText(i.emp,i.prog)}</strong></div><b>${R(i.emp)}</b>${bar(i.emp,i.prog)}</div><div class="finance-card finance-pago"><div class="finance-label"><span>Pago 2026</span><strong class="finance-pct">${pctText(i.pago,i.prog)}</strong></div><b>${R(i.pago)}</b>${bar(i.pago,i.prog)}</div></div>
<div class="detail-observations"><h3>Observação (pendências)</h3><div class="box"><ul>${obs}</ul></div></div>`}
['fpo','fst','finiciativa'].forEach(x=>$(x).onchange=draw);$('fq').oninput=draw;$('clr').onclick=()=>{$('fpo').value='';$('fst').value='';$('finiciativa').value='';$('fq').value='';draw()};
const nn=v=>typeof v==='number'?v:(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v.trim())?+v:0),ss=v=>v==null||v===''?'':String(v).replace(/\s+/g,' ').trim();
function parseWB(wb){
const sh=n=>{const w=wb.Sheets[n];if(!w)throw new Error('Aba não encontrada: '+n);return XLSX.utils.sheet_to_json(w,{header:1,defval:null,raw:true})};
const c=sh('Consolidado 2026'),ti=c.findIndex(r=>ss(r[0]).toUpperCase()==='TOTAL GERAL'),rows=ti<0?[]:c.slice(ti);
const H=r=>({dot:nn(r[4]),dec:nn(r[5]),livre:nn(r[7]),prog:nn(r[8]),aguard:nn(r[10]),emp:nn(r[11]),liq:nn(r[12]),pago:nn(r[13]),saldo:nn(r[14])});
const names=['SQPT','SENAPIR','SECRETARIA EXECUTIVA','SEPAR','OUVIDORIA','CNPIR'],units={};
rows.slice(1).forEach(r=>{const u=ss(r[0]);if(names.includes(u))units[u]=H(r)});
const l=sh('LIMITE DE MOVIMENTAÇÃO EMPENHO')[1]||[];
const tot=H(rows[0]||[]);if(!tot.dot||!Object.keys(units).length)throw new Error('Estrutura da aba "Consolidado 2026" não reconhecida');
const sheets=[['21FC - SENAPIR','SENAPIR'],['21FE - SQPT','SQPT'],['21FF - SEPAR','SEPAR'],['21HN - SEPAR','SEPAR'],['21HN - OUV','OUVIDORIA'],['21FG - CNPIR','CNPIR'],['2000 - SE','SECRETARIA EXECUTIVA'],['216H - SE','SECRETARIA EXECUTIVA']],ini=[];
sheets.forEach(([s,u])=>{if(!wb.Sheets[s])return;let h=null;
sh(s).forEach(r=>{if(r[0]==='UNIDADE'){h={};r.forEach((v,i)=>{if(v)h[ss(v).toUpperCase()]=i});return}
if(!h)return;const g=k=>{for(const kk in h)if(kk.startsWith(k))return r[h[kk]];return null};
const name=ss(g('INICIATIVAS')),prog=nn(g('PROGRAMADO')),emp=nn(g('EMPENHADO'));
if(!(prog||emp)||name.toUpperCase().startsWith('TOTAL'))return;
const ok=Object.keys(h).find(k=>k.startsWith('OBSERVAÇÃO'));
ini.push({u,acao:s.split(' ')[0],po:ss(g('PO')),name:name||'(sem descrição) — '+(ss(g('PARCEIRO'))||ss(g('DIRETORIA'))||'—'),sei:ss(g('SEI')),dir:ss(g('DIRETORIA')),resp:ss(g('RESPONSÁVEL')),inst:ss(g('INSTRUMENTO')),siafi:ss(g('SIAFI')),parc:ss(g('PARCEIRO')),ano:ss(g('ANO DE')),prog,emp,liq:nn(g('LIQUIDADO')),pago:nn(g('PAGO')),st:ss(g('STATUS'))||'—',prev:ss(g('PREVISÃO')),obs:ok?ss(r[h[ok]]):'',ppa:ss(g('ENTREGA'))})})});
return{tot,lme:{limite:nn(l[0]),aguard:nn(l[1]),emp:nn(l[2]),saldo:nn(l[6])},upd:ss((c.find(r=>/^Atualiza/i.test(ss(r[11])))||[])[11]),units,ini}}

$('fx').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{D=parseWB(XLSX.read(await f.arrayBuffer(),{type:'array'}));init();const agora=new Date();const dataHora=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(agora);$('upd').textContent='Planilha carregada em: '+dataHora; $('msg').textContent='✔ '+f.name+' ('+D.ini.length+' iniciativas)'}catch(x){$('msg').textContent='⚠ '+x.message}e.target.value=''};
init();

fetch('./dados.json?v=' + Date.now(), {cache:'no-store'})
  .then(r => {
    if (!r.ok) throw new Error('Não foi possível carregar os dados');
    return r.json();
  })
  .then(dados => {
    if (!dados.tot || !dados.lme || !Array.isArray(dados.ini)) {
      throw new Error('Arquivo de dados inválido');
    }
    D = dados;
    init();
  })
  .catch(erro => console.error('Mantidos os dados originais:', erro));
</script></body></html>
